[package]
name = "jarvis"
version = "0.4.0"
description = "JARVIS - central de terminais e agentes de IA para Windows"
authors = ["Alan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
which = "7"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
# `time` é necessário para o watchdog de inatividade do streaming de IA:
# um provedor que aceita a conexão e para de enviar bytes prenderia a
# geração para sempre, já que o cliente de streaming não pode ter timeout
# total (uma resposta longa leva minutos por natureza).
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures = "0.3"
rfd = "0.15"

# O updater só existe no desktop; no mobile a loja é quem atualiza.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
# parking_lot já é dependência normal (motor de PTY); repetida aqui só para
# deixar explícito que os testes de integração também a usam diretamente.
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
