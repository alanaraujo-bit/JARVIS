[package]
name = "jarvis"
version = "0.12.0"
description = "JARVIS - central de terminais e agentes de IA para Windows"
authors = ["Alan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
which = "7"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
# `time` é necessário para o watchdog de inatividade do streaming de IA:
# um provedor que aceita a conexão e para de enviar bytes prenderia a
# geração para sempre, já que o cliente de streaming não pode ter timeout
# total (uma resposta longa leva minutos por natureza).
#
# O trabalho compartilhado acrescenta "rt-multi-thread", "net", "io-util" e
# "process": o servidor de colaboração é um listener TCP com uma tarefa por
# convidado, e o túnel público é um processo filho cuja saída é lida em
# streaming à procura da URL.
tokio = { version = "1", features = [
  "sync",
  "time",
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "process",
] }
futures = "0.3"
rfd = "0.15"
# WebSocket do trabalho compartilhado. Sem TLS de propósito: na rede local o
# tráfego é `ws://` direto, e pela internet quem termina o TLS é o túnel — um
# segundo certificado aqui dentro não protegeria nada a mais e custaria
# tamanho de binário.
tokio-tungstenite = { version = "0.26", default-features = false, features = [
  "handshake",
] }
# QR do convite. Sem `image` e sem `svg`: o que sai daqui é a matriz de
# módulos, e quem desenha é o React. Gerar uma imagem no Rust para o WebView
# ter que decodificar de novo seria um formato a mais no meio do caminho.
qrcode = { version = "0.14", default-features = false }

# O updater só existe no desktop; no mobile a loja é quem atualiza.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
# parking_lot já é dependência normal (motor de PTY); repetida aqui só para
# deixar explícito que os testes de integração também a usam diretamente.
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
