[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - central de terminais e agentes de IA para Windows"
authors = ["Alan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
which = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
base64 = "0.22"
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
